# Build otomatis .dmg (Mac) dan .exe (Windows) di GitHub, gratis untuk repo pribadi (kuota menit Actions).
name: Build Price List Studio
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run fonts
      - run: npx electron-builder ${{ matrix.os == 'macos-latest' && '--mac' || '--win' }} --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: false }
      - uses: actions/upload-artifact@v4
        with:
          name: pricelist-studio-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
