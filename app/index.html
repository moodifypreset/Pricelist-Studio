<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price List Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- font dimuat per keluarga oleh script (lihat FONTS) -->
<style>
:root{--bg:#f3f1ec;--panel:#fff;--line:#e6e2da;--ink:#1f1d1a;--muted:#7b756c;--acc:#a9824a;--sel:#2f7cf6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:13px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:grid;grid-template-columns:64px 290px minmax(0,1fr) 284px;grid-template-rows:58px minmax(0,1fr) 118px;grid-template-areas:"top top top top" "rail left stage right" "rail left pages right";height:100vh}
#top{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap;line-height:1.15}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:"Playfair Display",Georgia,serif;font-size:18px;font-style:italic}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
#pname{border:1px solid transparent;background:transparent;font:inherit;font-weight:600;padding:6px 8px;border-radius:7px;width:200px;margin-left:8px}
#pname:hover,#pname:focus{border-color:var(--line);background:#faf9f6;outline:none}
#status{color:var(--muted);font-size:11.5px;white-space:nowrap}
.sp{flex:1}
.tb{display:flex;align-items:center;gap:4px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.2}
.btn:hover{background:#f7f5f1}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#3a362f}
.btn.danger{color:#b4372b}
.btn.ico{padding:7px;width:33px;justify-content:center}
.btn:disabled{opacity:.35;cursor:default}
.btn svg{width:16px;height:16px;flex:none}
.btn.full{width:100%;justify-content:center;white-space:normal;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:7px 10px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.seg button:disabled{opacity:.35;cursor:default}
select,input[type=text],input[type=number],textarea{font:inherit;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;line-height:1.45}
select:focus,input:focus,textarea:focus{outline:2px solid #e4d3b6;border-color:var(--acc)}
#rail{grid-area:rail;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
#rail button{width:54px;border:0;background:transparent;border-radius:10px;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted)}
#rail button svg{width:21px;height:21px}
#rail button:hover{background:#f7f5f1}
#rail button.on{background:#f0e9dd;color:var(--ink)}
#left{grid-area:left;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:4px 16px 20px}
#right{grid-area:right;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:4px 16px 20px}
h3{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin:20px 0 10px;font-weight:600}
.ptitle{font-size:15px;font-weight:700;margin:16px 0 4px;display:flex;align-items:center;gap:8px}
.chip{font-size:10.5px;font-weight:500;background:#f0e9dd;color:#7a5a2c;border-radius:20px;padding:2px 8px}
.hint{color:var(--muted);font-size:11.5px;line-height:1.55}
.hint b{color:var(--ink);font-weight:600}
.hint ul{padding-left:16px;margin:6px 0}
.hint li{margin-bottom:4px}
#stage{grid-area:stage;overflow:auto;position:relative;background:#e7e3dc;background-image:radial-gradient(#d8d3ca 1px,transparent 1px);background-size:18px 18px;display:flex;padding:44px}
#wrap{position:relative;margin:auto;flex:none}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0}
#pageEl{position:absolute;left:0;top:0;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.08);user-select:none;-webkit-user-select:none}
#pageEl .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.el{position:absolute;box-sizing:border-box}
.el:hover{outline:calc(1px*var(--iz)) solid rgba(47,124,246,.55)}
.el.t{white-space:pre;overflow:visible;word-break:normal}
.el.i{overflow:hidden}
.el.i img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.el.o{border-radius:50%}
.el.i .shade{position:absolute;inset:0;pointer-events:none}
.ph.logo{border:calc(1.5px*var(--iz)) dashed currentColor;opacity:.75;letter-spacing:2px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{position:relative;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:#f7f5f1;cursor:pointer}
.scard.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.scard .im{display:block;width:100%;background:#e9e5de}
.scard img{width:100%;display:block}
.scard .nm{padding:7px 8px;background:#fff;border-top:1px solid var(--line)}
.scard .nm b{display:block;font-size:11.5px}
.scard .nm span{font-size:10.5px;color:var(--muted)}
.scard .act{position:absolute;left:0;right:0;top:0;bottom:44px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;background:rgba(20,18,15,.55);opacity:0;transition:opacity .15s}
.scard:hover .act{opacity:1}
.scard .act button{border:0;border-radius:6px;padding:6px 10px;font-size:11px;background:#fff;width:84%}
.scard .act button.pri{background:var(--ink);color:#fff}
.tgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tgrid3 .tcard .nm{font-size:10px;padding:4px 6px;font-weight:500}
.tgrid3 .tcard .act{bottom:22px}
.tgrid3 .tcard .act button{font-size:10px;padding:5px 4px;width:90%}
.scard .nm .ds{display:block;margin-top:2px;line-height:1.35}
.scard .thumb{position:relative;aspect-ratio:4/5;background:#efebe4;display:flex;align-items:center;justify-content:center;padding:12px;cursor:pointer}
.scard .thumb .im{height:100%;max-width:100%;width:auto!important;box-shadow:0 6px 16px rgba(0,0,0,.18);background:#e2ddd4;overflow:hidden}
.scard .thumb .im img{width:100%;height:100%;object-fit:cover;display:block}
.scard .hov{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;background:rgba(20,18,15,.45);opacity:0;transition:opacity .15s}
.scard:hover .hov{opacity:1}
.scard .hov .btn{width:62%;justify-content:center;padding:8px 0}
.tplbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 4px}.tplbar .hint{margin:0;flex:1 1 160px}
.scard .nm{padding:8px 10px 10px}
.gsec{margin-bottom:22px}
.savedbadge{display:inline-block;margin:6px 0 8px;font-size:11px;font-weight:600;color:#2f7a4a;background:#e7f4ec;border-radius:20px;padding:3px 10px}.savedbadge.no{color:#8a5a00;background:#fbf0dc}
.fld{margin-bottom:9px}.fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.logorow{display:flex;align-items:center;gap:10px}.logorow img,.logorow .nologo{width:72px;height:48px;object-fit:contain;border:1px dashed #c9c2b6;border-radius:6px;background:#faf8f4}
.logorow .nologo{display:grid;place-items:center;font:700 9px system-ui;color:var(--muted);letter-spacing:1px}
.qrprev{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#faf8f4;min-height:60px;justify-content:center;text-align:center}
.qrprev img{width:130px;height:130px;image-rendering:pixelated}.qrprev small,.qrprev span{font-size:10.5px;color:var(--muted);word-break:break-all}
.gsh{display:flex;align-items:baseline;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.gsh b{font-size:13px}.gsh span{font-size:11.5px;color:var(--muted)}
.sbtns{display:flex;gap:6px;padding:0 8px 8px;background:#fff}
.sbtns .btn{flex:1;justify-content:center;font-size:11.5px;padding:6px 0}
.scard{cursor:default}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.pcard .im{display:block;width:100%;background:#eee}
.pcard .im img{width:100%;display:block}
.pcard .nm{font-size:11px;font-weight:600;padding:6px 8px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtns{display:flex;gap:4px;padding:0 6px 6px}
.pbtns .btn{flex:1;justify-content:center;font-size:10.5px;padding:5px 0}
.seg.full3{display:flex;width:100%}.seg.full3 button{flex:1;font-size:11px;padding:7px 1px}
.pbtns .btn.ico{flex:0 0 28px;width:28px;padding:4px}
#gallery{position:fixed;inset:0;background:rgba(20,18,15,.55);display:none;z-index:97;padding:4vh 4vw}
#gallery.open{display:block}
.gbox{background:#fff;border-radius:16px;height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.ghead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 26px 10px}
.gtitle{font-size:20px;font-weight:700;margin-bottom:4px}
.gbody{overflow:auto;padding:6px 26px 26px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;align-items:start}
.sgrid{align-items:start}
.blankim{display:grid!important;place-items:center;background:#f4f1ec!important;color:var(--muted)}
.blankim svg{width:30px;height:30px}
.setchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.setchips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:11px}
.setchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(6px*var(--iz));font:600 calc(11px*var(--iz))/1.3 system-ui,sans-serif;letter-spacing:.3px;text-align:center;padding:8px}
.ph svg{width:calc(28px*var(--iz));height:calc(28px*var(--iz))}
.el.editing{outline:calc(2px*var(--iz)) solid var(--sel)!important;white-space:pre-wrap!important;cursor:text;user-select:text;-webkit-user-select:text;caret-color:var(--sel)}
#overlay{position:absolute;left:0;top:0;pointer-events:none}
.sbox{position:absolute;border:calc(1.5px*var(--iz)) solid var(--sel)}
.sbox.grp{border-style:dashed;border-color:#7aa7f7}
.sbox.lk{border-color:#e0892b}
.sbox.crop{border:calc(2.5px*var(--iz)) dashed #ff9f1c}
#wrap.hiddenpg::before{content:'Halaman ini disembunyikan · tidak ikut export';position:absolute;left:0;right:0;top:-30px;text-align:center;font-size:12px;color:#8a5a00;font-weight:600}
#wrap.hiddenpg #pageEl{opacity:.55}
.pg.hid .th{opacity:.35}.pg.hid span::after{content:' · tersembunyi';color:#b0742a}
.hd{position:absolute;width:calc(11px*var(--iz));height:calc(11px*var(--iz));background:#fff;border:calc(1.5px*var(--iz)) solid var(--sel);border-radius:50%;pointer-events:auto;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.guide{position:absolute;background:#ff3d7f}
.mq{position:absolute;border:calc(1px*var(--iz)) solid var(--sel);background:rgba(47,124,246,.08)}
#pages{grid-area:pages;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 14px;overflow-x:auto}
.pg{flex:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.pg .th{height:76px;background:#fff;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.2);overflow:hidden;outline:2px solid transparent;outline-offset:2px}
.pg .th img{width:100%;height:100%;display:block}
.pg.on .th{outline-color:var(--sel)}
.pg.on{color:var(--ink);font-weight:600}
.pgadd{flex:none;height:76px;width:58px;border:1.5px dashed #c9c2b6;border-radius:6px;display:grid;place-items:center;background:transparent;color:var(--muted);margin-bottom:18px}
.pgadd:hover{background:#f7f5f1;color:var(--ink)}
.pgadd svg{width:20px;height:20px}
.pgtools{display:flex;gap:6px;align-items:center;margin-left:auto;padding-left:14px;margin-bottom:18px}
.themes{display:flex;flex-wrap:wrap;gap:6px}
.theme{border:1px solid var(--line);border-radius:20px;padding:4px 10px 4px 4px;display:flex;align-items:center;gap:6px;background:#fff;font-size:11.5px}
.theme.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.theme .dots{display:flex}
.theme .dots i{width:14px;height:14px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.12);margin-right:-4px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#f7f5f1}
.tcard .im{background:#eee;display:block;width:100%}
.tcard img{width:100%;display:block}
.tcard .nm{font-size:11px;padding:6px 8px;background:#fff;border-top:1px solid var(--line);font-weight:600}
.tcard .act{position:absolute;left:0;right:0;top:0;bottom:27px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;background:rgba(20,18,15,.55);opacity:0;transition:opacity .15s}
.tcard:hover .act{opacity:1}
.tcard .act button{border:0;border-radius:6px;padding:6px 10px;font-size:11px;background:#fff;width:80%}
.tcard .act button.pri{background:var(--ink);color:#fff}
.addlist{display:grid;gap:8px}
.additem{border:1px solid var(--line);border-radius:9px;background:#fff;padding:10px 12px;text-align:left;display:block;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.additem:hover{border-color:#cdbfa8;background:#fdfbf7}
.additem small{display:block;font:500 10.5px system-ui,sans-serif;color:var(--muted);margin-top:3px;white-space:normal}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shape{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;background:#fff;display:grid;place-items:center;padding:0}
.shape:hover{border-color:#cdbfa8;background:#fdfbf7}
.shape span{display:block;background:#cbb894}
.photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.photo{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#eee;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .pa{position:absolute;inset:auto 0 0 0;display:flex;gap:3px;padding:3px;opacity:0;transition:.15s}
.photo:hover .pa{opacity:1}
.photo .pa button{flex:1;border:0;border-radius:4px;font-size:10px;padding:3px 0;background:rgba(255,255,255,.92)}
.drop{border:1.5px dashed #c9c2b6;border-radius:10px;padding:16px;text-align:center;color:var(--muted);margin-top:10px;font-size:12px;line-height:1.5}
.drop.over{border-color:var(--acc);background:#fbf6ee}
.plist .pi{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:#fff}
.pi.cur{border-color:var(--ink)}
.pi img,.pi .noimg{width:40px;height:52px;object-fit:cover;border-radius:4px;background:#eee;flex:none}
.pi .meta{flex:1;min-width:0}
.pi .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.pi .meta span{font-size:11px;color:var(--muted)}
.stack{display:grid;gap:8px}
.row{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:8px;margin-bottom:10px}
.row>label{color:var(--muted);font-size:11.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;padding-left:8px;background:#fff}
.mini span{color:var(--muted);font-size:10.5px;width:12px}
.mini input{border:0;padding:6px 4px;outline:none!important;min-width:0}
.colorrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:7px;padding:2px;background:#fff;cursor:pointer}
.sw{width:19px;height:19px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0}
.sw.none{background:linear-gradient(135deg,#fff 44%,#e0443a 44%,#e0443a 56%,#fff 56%)}
.tg{display:flex;gap:4px}
.tg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 0;min-width:0}
.tg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tg button svg{width:15px;height:15px;vertical-align:middle}
input[type=range]{width:100%;accent-color:var(--ink)}
.rv{display:flex;align-items:center;gap:8px}
.rv output{font-size:11px;color:var(--muted);width:34px;text-align:right}
#ctxmenu{position:fixed;z-index:200;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:6px;min-width:236px;font-size:13px;user-select:none}
#ctxmenu .cmi{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;border:0;background:none;padding:7px 10px;border-radius:6px;text-align:left;font:inherit;color:inherit;cursor:pointer}
#ctxmenu .cmi:hover:not([disabled]){background:#f4f1ec}#ctxmenu .cmi[disabled]{opacity:.4;cursor:default}
#ctxmenu kbd{font:11px system-ui;color:#999}#ctxmenu .csep{height:1px;background:var(--line);margin:5px 4px}
#ctxmenu .clab{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#999;padding:6px 10px 3px}
#ctxmenu .crow{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:0 6px 4px}
#ctxmenu .crow button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 0;font-size:14px;cursor:pointer}#ctxmenu .crow button:hover{background:#f4f1ec}
.safem{position:absolute;border:0 dashed #12b5cb;box-sizing:border-box;border-style:dashed}
.safetag{position:absolute;transform:translateY(-100%) scale(var(--iz));transform-origin:left bottom;font:600 10px system-ui;color:#0f97aa;white-space:nowrap;padding:0 0 2px}
.safebad{position:absolute;outline:0 dashed #e0245e;outline-style:dashed;background:rgba(224,36,94,.07)}
#fx{position:fixed;inset:0;background:rgba(20,18,15,.5);display:none;z-index:150;padding:4vh 3vw}#fx.open{display:flex;align-items:center;justify-content:center}
.fxbox{background:#fff;border-radius:14px;width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3)}.fxbox.wide{width:min(1120px,100%)}
.fxhead{display:flex;justify-content:space-between;gap:16px;padding:18px 22px 10px;border-bottom:1px solid var(--line)}.fxtitle{font:600 19px/1.3 system-ui;margin-bottom:3px}
.fxbody{padding:16px 22px 20px;overflow:auto}.fxbody input:not([type]),.fxbody input[type=date]{font:inherit;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;color:var(--ink);width:100%}.fxfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.mctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.mctl select{width:auto}.mut{color:var(--muted);font-size:12px}
.ptable{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px}.ptable table{width:100%;border-collapse:collapse;font-size:12.5px}
.ptable th{position:sticky;top:0;background:#faf8f4;text-align:left;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line)}.ptable td{padding:6px 8px;border-bottom:1px solid #f0ece5;vertical-align:top}

const MC=document.createElement('canvas').getContext('2d');
const fontCSS=e=>`${e.italic?'italic ':''}${e.weight||400} ${e.size}px ${fam(e.font)}`;
const tw=(ctx,s,ls)=>ctx.measureText(s).width+(ls||0)*[...s].length;
function wrapLines(ctx,text,maxW,ls){
  const out=[],lim=maxW+0.5;
  for(const para of String(text).split('\n')){
    if(para===''){out.push('');continue;}
    const toks=para.match(/\s+|\S+/g)||[''];
    let line='';
    const breakWord=(tok)=>{let cur=line;for(const ch of tok){if(cur.trim()!==''&&tw(ctx,cur+ch,ls)>lim){out.push(cur.replace(/\s+$/,''));cur=ch;}else cur+=ch;}line=cur;};
    for(const tok of toks){
      if(/^\s+$/.test(tok)){line+=tok;continue;}
      if(line.trim()===''){ if(tw(ctx,line+tok,ls)>lim) breakWord(tok); else line+=tok; continue; }
      if(tw(ctx,(line+tok).replace(/\s+$/,''),ls)<=lim){line+=tok;}
      else{out.push(line.replace(/\s+$/,''));line='';if(tw(ctx,tok,ls)>lim)breakWord(tok);else line=tok;}
    }
    out.push(line.replace(/\s+$/,''));
  }
  return out;
}
function textLayout(e){
  MC.font=fontCSS(e);
  const str=e.upper?String(e.text).toUpperCase():String(e.text);
  const lines=wrapLines(MC,str,Math.max(4,e.w),e.ls||0);
  const lineH=e.size*(e.lh||1.3);
  return{lines,lineH,h:Math.max(1,lines.length)*lineH};
}

const SEGMENTS=[['foto','Fotografer','Wedding, prewedding, wisuda, maternity, family & produk'],['video','Videografer','Film pernikahan & highlight'],['mua','MUA & Hair','Makeup pengantin, wisuda & keluarga'],['wo','Wedding Organizer','Koordinasi & perencanaan acara'],['atelier','Atelier & Wardrobe','Gaun, kebaya, jas & sewa busana'],['deco','Dekorasi','Pelaminan, area tamu & event'],['catering','Catering','Buffet, gubukan & menu wedding']];
const SEG_OF={vid:'video',mua:'mua',deco:'deco'};
Object.keys(SETS).forEach(k=>{if(!SETS[k].seg)SETS[k].seg=SEG_OF[k]||'foto';});
let segFilter='all';
const segCount=g=>Object.keys(SETS).filter(k=>SETS[k].seg===g).length;
function segChips(attr){return `<div class="segchips">${[['all','Semua',Object.keys(SETS).length]].concat(SEGMENTS.map(([g,l])=>[g,l,segCount(g)])).map(([g,l,n])=>`<button class="${segFilter===g?'on':''}" ${attr}="${g}">${l} <i>${n}</i></button>`).join('')}</div>`;}
setSections=function(gridCls,extra){const mine=myTpls.filter(r=>r.kind==='project');
  let h=segChips(gridCls==='ggrid'?'data-gseg':'data-lseg');
  if(segFilter==='all')h+=tplBar(false);
  if(mine.length&&segFilter==='all')h+=`<div class="gsec"><div class="gsh"><b>Template Saya</b><span>desain yang kamu simpan sendiri · ${mine.length} template</span></div><div class="${gridCls}">${mine.map(myCard).join('')}</div></div>`;
  SEGMENTS.forEach(([g,l,dsc])=>{if(segFilter!=='all'&&segFilter!==g)return;const ks=Object.keys(SETS).filter(k=>SETS[k].seg===g).sort((a,b)=>((SETS[a].size||'a4')==='a4'?0:1)-((SETS[b].size||'a4')==='a4'?0:1));if(!ks.length)return;
    const na=ks.filter(k=>(SETS[k].size||'a4')==='a4').length,ns=ks.length-na;
    h+=`<div class="gsec"><div class="gsh"><b>Template Vendor ${l}</b><span>${dsc} · ${ks.length} template${na&&ns?` (${na} A4, ${ns} Story)`:''}</span></div><div class="${gridCls}">${ks.map(setCard).join('')}</div></div>`;});
  if(segFilter==='all')h+=`<div class="gsec"><div class="gsh"><b>Template dasar</b><span>halaman sederhana yang bisa diganti tema warnanya</span></div><div class="${gridCls}">${basicCard()}${extra?blankCard():''}</div></div>`;
  return h;};
document.addEventListener('click',ev=>{const g=ev.target.closest('[data-gseg]');if(g){ev.stopPropagation();segFilter=g.dataset.gseg;const body=$('#gallery .gbody');body.innerHTML=setSections('ggrid',true);fillLeftThumbs(body);body.scrollTop=0;return;}
  const l=ev.target.closest('[data-lseg]');if(l){ev.stopPropagation();segFilter=l.dataset.lseg;renderLeft();left.scrollTop=0;}},true);

/* ---------- MEMORI ISIAN: teks yang sudah diubah ikut pindah saat ganti template ---------- */
const BUL=/^(\s*(?:•|—|–|-|✓)\s+)/;
const stripL=l=>String(l).replace(BUL,'').trim();
const preOf=l=>(String(l).match(BUL)||['',''])[1];
function emptyMem(){return{block:{},map:{},del:{},ins:{},insB:{}};}
function loadMem(){try{const m=JSON.parse(localStorage.getItem('pls_mem')||'null');return m&&m.map?Object.assign(emptyMem(),m):emptyMem();}catch(e){return emptyMem();}}
function saveMem(m){try{localStorage.setItem('pls_mem',JSON.stringify(m));}catch(e){}}
function clearMem(){try{localStorage.removeItem('pls_mem');}catch(e){}}
function lcsOps(a,b,eq){const n=a.length,m=b.length,d=[...Array(n+1)].map(()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=eq(a[i],b[j])?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ops=[];let i=0,j=0;while(i<n&&j<m){if(eq(a[i],b[j])){ops.push(['eq',i,j]);i++;j++;}else if(d[i+1][j]>=d[i][j+1])ops.push(['del',i++]);else ops.push(['ins',j++]);}
  while(i<n)ops.push(['del',i++]);while(j<m)ops.push(['ins',j++]);return ops;}
function memFromProject(p,mem){mem=mem||emptyMem();const st=Object.assign({},STUDIO_DEF,p.studio||{});
  const sameAsStudio=(o,n)=>n===o||n===replaceStudioText(o,STUDIO_DEF,st);
  const rv=x=>x?replaceStudioText(x,st,STUDIO_DEF):x;
  for(const pg of p.pages||[])for(const e of pg.elements||[]){
    if(e.type!=='text'||e.orig==null||e.text===e.orig)continue;
    const o=String(e.orig).split('\n').map(stripL),n=String(e.text).split('\n').map(stripL);
    if(o.length===n.length&&o.every((x,i)=>sameAsStudio(x,n[i])))continue;
    const okey=o.join('\n');if(okey.trim())mem.block[okey]=n.map(rv);
    const ops=lcsOps(o,n,(x,y)=>sameAsStudio(x,y));let lastO=null,k=0;
    while(k<ops.length){
      if(ops[k][0]==='eq'){lastO=o[ops[k][1]];k++;continue;}
      const dels=[],inss=[];while(k<ops.length&&ops[k][0]!=='eq'){if(ops[k][0]==='del')dels.push(o[ops[k][1]]);else inss.push(n[ops[k][2]]);k++;}
      const pairs=Math.min(dels.length,inss.length);
      for(let q=0;q<pairs;q++){if(dels[q])mem.map[dels[q]]=rv(inss[q]);lastO=dels[q]||lastO;}
      dels.slice(pairs).forEach(x=>{if(x){mem.del[x]=1;delete mem.map[x];}});
      const extra=inss.slice(pairs).map(rv);
      if(extra.length){if(lastO)mem.ins[lastO]=extra;else{const nextEq=ops.slice(k).find(op=>op[0]==='eq');if(nextEq)mem.insB[o[nextEq[1]]]=extra;}}
    }}
  return mem;}
function applyMemText(text,mem){
  const lines=String(text).split('\n'),key=lines.map(stripL).join('\n');
  if(key.trim()&&mem.block[key]){const pre=preOf(lines.find(l=>stripL(l))||'');return mem.block[key].map(x=>x?pre+x:'').join('\n');}
  const out=[];for(const line of lines){const k=stripL(line),pre=preOf(line)||(lines.some(l=>preOf(l))?preOf(lines.find(l=>preOf(l))):'');
    if(k&&mem.insB[k])mem.insB[k].forEach(x=>out.push(x?pre+x:''));
    if(k&&mem.del[k])continue;
    out.push(k&&mem.map[k]!=null?preOf(line)+mem.map[k]:line);
    if(k&&mem.ins[k])mem.ins[k].forEach(x=>out.push(x?pre+x:''));}
  return out.join('\n');}
function applyMemPage(pg,mem){let n=0;const fix=e=>{if(e.type!=='text'||e.deco)return;const t2=applyMemText(e.text,mem);if(t2!==e.text){e.text=t2;n++;}};
  pg.elements.forEach(fix);if(pg.stash)Object.values(pg.stash).forEach(fix);return n;}
const memSize=m=>Object.keys(m.block).length+Object.keys(m.map).length;
function rememberCurrent(){if(!P)return;try{saveMem(memFromProject(P,loadMem()));}catch(e){console.warn(e);}}
function resetPageText(pg){let n=0;const st=curStudio();pg.elements.forEach(e=>{if(e.type==='text'&&e.orig!=null){const t2=replaceStudioText(e.orig,STUDIO_DEF,st);if(t2!==e.text){e.text=t2;n++;}}});return n;}

const urlCache=new Map(),imgCache=new Map();
function dataURLtoBlob(d){const i=d.indexOf(',');const mime=(d.slice(0,i).match(/data:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(d.slice(i+1));const a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type:mime});}
function assetURL(id){if(urlCache.has(id))return urlCache.get(id);const d=P.assets[id];if(!d)return'';let u=d;try{u=URL.createObjectURL(dataURLtoBlob(d));}catch(e){}urlCache.set(id,u);return u;}
function getImg(id){if(imgCache.has(id))return imgCache.get(id);const p=new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=assetURL(id);});imgCache.set(id,p);return p;}
async function fileToAsset(file){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('format'));i.src=url;});
    const max=2000,k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
    const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.naturalWidth*k));cv.height=Math.max(1,Math.round(im.naturalHeight*k));
    const ctx=cv.getContext('2d');const alpha=/png|webp|gif|svg/.test(file.type);
    if(!alpha){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);}
    ctx.drawImage(im,0,0,cv.width,cv.height);
    const data=alpha?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',0.88);
    const id='a'+uid();P.assets[id]=data;return{id,w:cv.width,h:cv.height};

  if(hd&&sel.length===1){const e=getEl(sel[0]);drag={mode:'resize',dir:hd.dataset.dir,p0:p,e0:clone(e),id:e.id};ev.preventDefault();return;}
  const e=hitEl(ev);

    else if(sel.includes(e.id)){if(e.group&&sel.length>1&&mem.length===sel.length&&mem.every(id=>sel.includes(id)))pendingSingle=e.id;}
    else sel=mem;
    renderOverlay();renderProps();
    const moving=sel.map(getEl).filter(x=>x&&!x.locked);
    drag={mode:'move',p0:p,starts:moving.map(x=>({id:x.id,x:x.x,y:x.y})),moved:false,pendingSingle,bbox:moving.length?bboxOf(moving):null};
    ev.preventDefault();return;

function snap(bb,dx,dy,off){
  const guides=[];if(off||!bb)return{dx,dy,guides};
  const{W,H}=dims();const th=6/zoom;const xs=[0,W/2,W],ys=[0,H/2,H];if(safeCfg().show){const sb=safeBox();xs.push(sb.x,sb.x+sb.w);ys.push(sb.y,sb.y+sb.h);}
  for(const e of page().elements){if(sel.includes(e.id))continue;xs.push(e.x,e.x+e.w/2,e.x+e.w);ys.push(e.y,e.y+e.h/2,e.y+e.h);}
  const pick=(srcs,tgts)=>{let best=null;for(const a of srcs)for(const b of tgts){const d=b-a;if(Math.abs(d)<th&&(!best||Math.abs(d)<Math.abs(best.d)))best={d,b};}return best;};
  const bx=pick([bb.x+dx,bb.x+dx+bb.w/2,bb.x+dx+bb.w],xs);if(bx){dx+=bx.d;guides.push({v:true,at:bx.b});}
  const by=pick([bb.y+dy,bb.y+dy+bb.h/2,bb.y+dy+bb.h],ys);if(by){dy+=by.d;guides.push({v:false,at:by.b});}
  return{dx,dy,guides};
}
function doResize(p,keep){
  const e=getEl(drag.id),o=drag.e0,dir=drag.dir,dx=p.x-drag.p0.x,dy=p.y-drag.p0.y;
  if(e.type==='text'){
    if(dir==='e')e.w=r1(Math.max(12,o.w+dx));
    else if(dir==='w'){const w=Math.max(12,o.w-dx);e.x=r1(o.x+o.w-w);e.w=r1(w);}
    else{const sign=dir.includes('e')?1:-1;const w=Math.max(12,o.w+sign*dx),k=w/o.w;
      e.w=r1(w);e.size=Math.max(4,r1(o.size*k));e.ls=r1((o.ls||0)*k);
      if(dir.includes('w'))e.x=r1(o.x+o.w-w);
      if(dir.includes('n')){const nh=textLayout(e).h;e.y=r1(o.y+o.h-nh);}}
    return;
  }
  let w=o.w,h=o.h;
  if(dir.includes('e'))w=o.w+dx;if(dir.includes('w'))w=o.w-dx;if(dir.includes('s'))h=o.h+dy;if(dir.includes('n'))h=o.h-dy;
  if((keep||e.type==='image'&&e.radius>=Math.min(o.w,o.h)/2)&&dir.length===2){const k=Math.max(w/o.w,h/o.h);w=o.w*k;h=o.h*k;}
  w=Math.max(4,w);h=Math.max(1,h);
  const x=dir.includes('w')?o.x+o.w-w:o.x,y=dir.includes('n')?o.y+o.h-h:o.y;
  Object.assign(e,{x:r1(x),y:r1(y),w:r1(w),h:r1(h)});
  if(e.type==='image'&&o.radius>=Math.min(o.w,o.h)/2)e.radius=r1(Math.min(e.w,e.h)/2);
}
window.addEventListener('pointermove',ev=>{
  if(!drag)return;const p=pt(ev);
  if(drag.mode==='move'){
    let dx=p.x-drag.p0.x,dy=p.y-drag.p0.y;
    if(!drag.moved&&Math.hypot(dx,dy)*zoom<3)return;
    drag.moved=true;if(!drag.starts.length)return;
    const g=snap(drag.bbox,dx,dy,ev.altKey);dx=g.dx;dy=g.dy;
    for(const s of drag.starts){const e=getEl(s.id);if(!e)continue;e.x=r1(s.x+dx);e.y=r1(s.y+dy);const n=nodeOf(e.id);if(n){n.style.left=e.x+'px';n.style.top=e.y+'px';}}
    renderOverlay(g.guides);
  }else if(drag.mode==='resize'){
    doResize(p,ev.shiftKey);drag.moved=true;const e=getEl(drag.id);const n=nodeOf(e.id);if(n)styleNode(n,e);renderOverlay();
  }else if(drag.mode==='pan'){
    const e=getEl(drag.id);if(e){panCrop(e,drag.o,p.x-drag.p0.x,p.y-drag.p0.y);drag.moved=true;const n=nodeOf(e.id);if(n)styleNode(n,e);}
  }else if(drag.mode==='marquee'){
    const r={x:Math.min(p.x,drag.p0.x),y:Math.min(p.y,drag.p0.y),w:Math.abs(p.x-drag.p0.x),h:Math.abs(p.y-drag.p0.y)};
    drag.rect=r;renderOverlay(null,r);
  }
});
window.addEventListener('pointerup',()=>{
  if(!drag)return;const d=drag;drag=null;
  if(d.mode==='move'){if(d.moved){commit();renderOverlay();renderProps();}else if(d.pendingSingle){sel=[d.pendingSingle];renderOverlay();renderProps();}}
  else if(d.mode==='resize'){if(d.moved)commit();renderOverlay();renderProps();}
  else if(d.mode==='pan'){scheduleThumbs();}
  else if(d.mode==='marquee'){
    const r=d.rect;
    if(r&&(r.w>3/zoom||r.h>3/zoom)){
      const ids=new Set(d.base);
      for(const e of page().elements){if(!e.deco&&e.x<r.x+r.w&&e.x+e.w>r.x&&e.y<r.y+r.h&&e.y+e.h>r.y)groupMembers(e).forEach(id=>ids.add(id));}
      sel=[...ids];}
    renderOverlay();renderProps();
  }
});

/* edit teks langsung di halaman */
function startEdit(id){
  const e=getEl(id);if(!e||e.type!=='text')return;if(e.locked){toast('Elemen terkunci. Buka kunci dulu di panel kanan.');return;}
  const n=nodeOf(id);if(!n)return;
  sel=[id];editingId=id;renderOverlay();renderProps();
  n.classList.add('editing');n.textContent=e.text;n.style.height='auto';n.style.minHeight=e.size*(e.lh||1.3)+'px';n.style.textTransform=e.upper?'uppercase':'none';
  let ok=false;try{n.contentEditable='plaintext-only';ok=n.contentEditable==='plaintext-only';}catch(_){}
  if(!ok)n.contentEditable='true';
  n.focus();const r=document.createRange();r.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(r);
}
function finishEdit(silent){
  if(!editingId)return;const id=editingId;editingId=null;
  const n=nodeOf(id),e=getEl(id);
  if(n){n.style.textTransform='none';if(e)e.text=n.innerText.replace(/\n$/,'');n.removeAttribute('contenteditable');n.classList.remove('editing');n.style.minHeight='';n.style.textTransform='';n.textContent='';}
  try{getSelection().removeAllRanges();}catch(_){}
  renderCanvas();renderOverlay();if(!silent){renderProps();commit();}
}

/* ---------- aksi elemen ---------- */
function deleteSel(){if(!sel.length)return;page().elements=page().elements.filter(e=>!sel.includes(e.id));sel=[];commit();renderCanvas();renderOverlay();renderProps();}
function duplicateSel(){const els=page().elements.filter(e=>sel.includes(e.id));if(!els.length)return;const cp=remapIds(els);cp.forEach(e=>{e.x=r1(e.x+16);e.y=r1(e.y+16);delete e.role;});page().elements.push(...cp);sel=cp.map(e=>e.id);commit();renderCanvas();renderOverlay();renderProps();}
function copySel(){const els=page().elements.filter(e=>sel.includes(e.id));if(els.length){clip=clone(els);toast(`${els.length} elemen disalin`,1200);}}
function pasteClip(){if(!clip)return;const cp=remapIds(clip);cp.forEach(e=>{e.x=r1(e.x+16);e.y=r1(e.y+16);delete e.role;});clip=clone(cp);page().elements.push(...cp);sel=cp.map(e=>e.id);commit();renderCanvas();renderOverlay();renderProps();}
function reorder(mode){
  const arr=page().elements,s=new Set(sel);const picked=arr.filter(e=>s.has(e.id)),rest=arr.filter(e=>!s.has(e.id));
  if(mode==='front')page().elements=[...rest,...picked];
  else if(mode==='back')page().elements=[...picked,...rest];
  else if(mode==='fwd'){for(let i=arr.length-2;i>=0;i--)if(s.has(arr[i].id)&&!s.has(arr[i+1].id))[arr[i],arr[i+1]]=[arr[i+1],arr[i]];}
  else if(mode==='bwd'){for(let i=1;i<arr.length;i++)if(s.has(arr[i].id)&&!s.has(arr[i-1].id))[arr[i],arr[i-1]]=[arr[i-1],arr[i]];}
  commit();renderCanvas();renderOverlay();
}
function alignSel(how){
  const els=sel.map(getEl).filter(Boolean);if(!els.length)return;const{W,H}=dims();
  const b=els.length>1?bboxOf(els):{x:0,y:0,w:W,h:H};
  for(const e of els){
    if(how==='l')e.x=r1(b.x);if(how==='c')e.x=r1(b.x+(b.w-e.w)/2);if(how==='r')e.x=r1(b.x+b.w-e.w);
    if(how==='t')e.y=r1(b.y);if(how==='m')e.y=r1(b.y+(b.h-e.h)/2);if(how==='b')e.y=r1(b.y+b.h-e.h);}
  commit();renderCanvas();renderOverlay();
}
function centerOnPage(axis){
  const els=sel.map(getEl).filter(Boolean);if(!els.length)return;const{W,H}=dims();const b=bboxOf(els);
  const dx=axis==='h'?W/2-(b.x+b.w/2):0,dy=axis==='v'?H/2-(b.y+b.h/2):0;
  els.forEach(e=>{e.x=r1(e.x+dx);e.y=r1(e.y+dy);});commit();renderCanvas();renderOverlay();
}
function distribute(axis){
  const els=sel.map(getEl).filter(Boolean);if(els.length<3)return;
  const k=axis==='h'?'x':'y',d=axis==='h'?'w':'h';els.sort((a,b)=>a[k]-b[k]);
  const first=els[0],last=els[els.length-1];const total=els.reduce((s,e)=>s+e[d],0);
  const gap=(last[k]+last[d]-first[k]-total)/(els.length-1);let pos=first[k];
  els.forEach(e=>{e[k]=r1(pos);pos+=e[d]+gap;});commit();renderCanvas();renderOverlay();
}
function groupSel(){const els=sel.map(getEl).filter(Boolean);if(els.length<2)return;const g=uid();els.forEach(e=>e.group=g);commit();renderProps();toast('Elemen digabung jadi grup');}

function relLum(h){const m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m)return 1;const n=parseInt(m[1],16);const c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];}

const CONTENT_KEYS=['text','asset','px','py','fit','locked','opacity'];
const STYLE_KEYS=['color','font','weight','italic','upper','strike','fill','strokeColor','ph','bw','shade','shadeMode'];
function scaleEl(e,sx,sy){e.x=r1(e.x*sx);e.y=r1(e.y*sy);e.w=r1(e.w*sx);e.h=r1(e.h*sy);const k=Math.min(sx,sy);if(e.type==='text'){e.size=r1(e.size*k);e.ls=r1((e.ls||0)*k);}if(e.radius)e.radius=r1(e.radius*k);}
function regenPage(pg,layout,themeKey,W,H,oldW,oldH,keepStyle,opts){
  if(opts===undefined)opts=pg.tpl&&pg.tpl.opts||null;
  const fresh=gen(layout,themeKey,W,H,opts);
  const oldRoles=new Map();pg.elements.forEach(e=>{if(e.role)oldRoles.set(e.role,e);});
  const had=new Set(pg.tplRoles||[...oldRoles.keys()]);const used=new Set();const out=[];
  const stash=pg.stash||{};const freshRoles=new Set(fresh.tplRoles);
  for(const ne of fresh.elements){
    if(!ne.role){out.push(ne);continue;}
    let oe=oldRoles.get(ne.role),fromStash=false;
    if(!oe&&stash[ne.role]){oe=stash[ne.role];delete stash[ne.role];fromStash=true;}
    if(oe&&oe.type===ne.type){
      CONTENT_KEYS.forEach(k=>{if(oe[k]!==undefined)ne[k]=oe[k];});
      if(keepStyle&&!fromStash)STYLE_KEYS.forEach(k=>{if(oe[k]!==undefined)ne[k]=oe[k];});

    if(e.role&&!freshRoles.has(e.role)&&pg.tpl&&pg.tpl.layout===layout){stash[e.role]=clone(e);continue;}

/* ---------- keyboard ---------- */
let nudgeT=null;
window.addEventListener('keydown',ev=>{
  const mod=ev.ctrlKey||ev.metaKey,k=ev.key.toLowerCase();
  if(editingId){if(ev.key==='Escape'){ev.preventDefault();finishEdit();}return;}
  if(cropId&&(ev.key==='Enter'||ev.key==='Escape')){ev.preventDefault();endCrop();return;}
  if(mod&&k==='s'){ev.preventDefault();saveNow(false);return;}
  if($('#modal').classList.contains('open'))return;
  if($('#gallery').classList.contains('open')){if(ev.key==='Escape')closeGallery();return;}
  const t=ev.target,tag=(t.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||t.isContentEditable)return;
  if(mod&&k==='z'){ev.preventDefault();ev.shiftKey?redo():undo();return;}
  if(mod&&k==='y'){ev.preventDefault();redo();return;}
  if(mod&&k==='d'){ev.preventDefault();duplicateSel();return;}
  if(mod&&k==='c'){copySel();return;}
  if(mod&&k==='v'){ev.preventDefault();pasteClip();return;}
  if(mod&&k==='g'){ev.preventDefault();ev.shiftKey?ungroupSel():groupSel();renderOverlay();return;}
  if(mod&&k==='a'){ev.preventDefault();sel=page().elements.map(e=>e.id);renderOverlay();renderProps();return;}
  if(ev.key==='Delete'||ev.key==='Backspace'){if(sel.length){ev.preventDefault();deleteSel();}return;}
  if(ev.key==='Escape'){sel=[];closeMenus();renderOverlay();renderProps();return;}
  if(ev.key==='Enter'&&sel.length===1){const e=getEl(sel[0]);if(e&&e.type==='text'){ev.preventDefault();startEdit(e.id);}return;}
  const arrows={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(arrows[ev.key]&&sel.length){ev.preventDefault();const st=ev.shiftKey?10:1;const[dx,dy]=arrows[ev.key];
    sel.map(getEl).forEach(e=>{if(e&&!e.locked){e.x=r1(e.x+dx*st);e.y=r1(e.y+dy*st);}});renderCanvas();renderOverlay();
    clearTimeout(nudgeT);nudgeT=setTimeout(()=>{commit();renderProps();},350);}
});

/* ---------- simpan (IndexedDB) & file proyek ---------- */
const DB=(()=>{let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('pricelist-studio',2);
    r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('projects'))db.createObjectStore('projects',{keyPath:'id'});if(!db.objectStoreNames.contains('templates'))db.createObjectStore('templates',{keyPath:'id'});};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}}));
  const tx=async(mode,fn,store)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction(store||'projects',mode);const r=fn(t.objectStore(store||'projects'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});};
  return{put:r=>tx('readwrite',s=>s.put(r)),get:id=>tx('readonly',s=>s.get(id)),all:()=>tx('readonly',s=>s.getAll()),del:id=>tx('readwrite',s=>s.delete(id)),
    tput:r=>tx('readwrite',s=>s.put(r),'templates'),tall:()=>tx('readonly',s=>s.getAll(),'templates'),tdel:id=>tx('readwrite',s=>s.delete(id),'templates')};
})();

const MAGIC=[77,68,70,89];
async function packFileBlob(){
  const json=JSON.stringify({format:'moodify-pricelist',version:2,app:'Price List Studio',savedAt:new Date().toISOString(),project:packProject()});
  if(typeof CompressionStream!=='undefined'){try{const gz=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();

  return new Blob([json],{type:'application/octet-stream'});

async function unpackFile(file){
  const buf=new Uint8Array(await file.arrayBuffer());let text;
  const gunzip=async b=>{if(typeof DecompressionStream==='undefined')throw new Error('nogzip');return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text();};
  if(MAGIC.every((v,i)=>buf[i]===v))text=await gunzip(buf.slice(5));
  else if(buf[0]===0x1f&&buf[1]===0x8b)text=await gunzip(buf);
  else text=new TextDecoder().decode(buf);
  const o=JSON.parse(text);return o.project||o;
}

async function fontsReady(){try{await Promise.race([document.fonts.ready,sleep(3000)]);}catch(e){}}
async function canvasToBlob(cv,type,q){return new Promise(r=>cv.toBlob(r,type,q));}
let exportLinks=true;
function lineUrl(seg){const st=curStudio();
  const em=seg.match(/[\w.+-]+@[\w-]+\.[\w.]+/);if(em)return'mailto:'+em[0];
  const ph=seg.match(/(\+?62|0)8[\d\s-]{7,14}\d/);if(ph){let d=ph[0].replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);return`https://wa.me/${d}`+(st.waMsg?`?text=${encodeURIComponent(st.waMsg)}`:'');}
  const ig=seg.match(/@([A-Za-z0-9_.]{2,30})/);if(ig)return'https://instagram.com/'+ig[1].replace(/\.$/,'');
  const w=seg.match(/\b((?:https?:\/\/)?(?:www\.)?[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|id|net|org|co|studio|photo|photos|art|me|io|wedding)(?:\/[^\s]*)?)\b/i);if(w)return/^https?:/i.test(w[1])?w[1]:'https://'+w[1];
  return null;}
function pageLinks(pg){const out=[];
  for(const e of pg.elements){
    if(e.type==='image'&&e.qr&&e.asset){const u=qrUrl(curStudio());if(u)out.push({x:e.x,y:e.y,w:e.w,h:e.h,url:u});continue;}
    if(e.type!=='text')continue;const L=textLayout(e);MC.font=fontCSS(e);const ls=e.ls||0;
    L.lines.forEach((line,i)=>{if(!line.trim())return;const lw=tw(MC,line,ls);let x0=e.x;if(e.align==='center')x0=e.x+(e.w-lw)/2;else if(e.align==='right')x0=e.x+e.w-lw;
      const parts=line.split(/(\s+[·•|]\s+|\s{2,})/);let off=0;
      for(const part of parts){const pw=tw(MC,part,ls);const u=/^\s/.test(part)?null:lineUrl(part);
        if(u)out.push({x:x0+off,y:e.y+i*L.lineH,w:pw,h:L.lineH,url:u});off+=pw;}});}
  return out;}
async function doExport(kind){
  if(['zipJpg','zipPng','wa','ig45','igst'].includes(kind))return exportImages(kind);

      if(await download(new Blob([buildPDF(imgs,W*0.75,H*0.75)],{type:'application/pdf'}),`${name}.pdf`))toast(`PDF ${vis.length} halaman didownload${nl?` · ${nl} link bisa diklik`:''}${hid?` · ${hid} halaman tersembunyi dilewati`:''}`,4500);

function buildPDF(imgs,wPt,hPt){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length;};
  const f=v=>(Math.round(v*100)/100).toString();const n=imgs.length;let next=3+n*3;
  const pdfStr=u=>u.replace(/[^\x20-\x7e]/g,c=>encodeURIComponent(c)).replace(/[\\()]/g,m=>'\\'+m);
  const annots=imgs.map(im=>(im.links||[]).map(l=>({n:next++,l})));const total=next-1;
  add(new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10]));
  offs[1]=len;add('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  offs[2]=len;add(`2 0 obj\n<< /Type /Pages /Kids [${imgs.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] /Count ${n} >>\nendobj\n`);
  const k=0.75;
  imgs.forEach((im,i)=>{const po=3+i*3,co=po+1,io=po+2;const an=annots[i];
    offs[po]=len;add(`${po} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${f(wPt)} ${f(hPt)}] /Resources << /XObject << /Im${i} ${io} 0 R >> >> /Contents ${co} 0 R${an.length?` /Annots [${an.map(a=>a.n+' 0 R').join(' ')}]`:''} >>\nendobj\n`);
    const cs=`q ${f(wPt)} 0 0 ${f(hPt)} 0 0 cm /Im${i} Do Q`;
    offs[co]=len;add(`${co} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    offs[io]=len;add(`${io} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.pw} /Height ${im.ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);add(im.bytes);add('\nendstream\nendobj\n');});
  annots.forEach(list=>list.forEach(({n:on,l})=>{let u;try{u=pdfStr(l.url);}catch(e){u=l.url.replace(/[^\x20-\x7e]/g,'').replace(/[\\()]/g,m=>'\\'+m);}
    const r=[l.x*k,hPt-(l.y+l.h)*k,(l.x+l.w)*k,hPt-l.y*k].map(f).join(' ');
    offs[on]=len;add(`${on} 0 obj\n<< /Type /Annot /Subtype /Link /Rect [${r}] /Border [0 0 0] /A << /S /URI /URI (${u}) >> >>\nendobj\n`);}));
  const xref=len;let x=`xref\n0 ${total+1}\n0000000000 65535 f \n`;for(let q=1;q<=total;q++)x+=String(offs[q]).padStart(10,'0')+' 00000 n \n';add(x);
  add(`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out=new Uint8Array(len);let o=0;for(const p of parts){out.set(p,o);o+=p.length;}return out;
}

      if(unit)v=p.n*UNIT_MULT[unit];else if(p.n<1000)v=p.n*1e6;else v=p.n;

function openMass(tabName){const body=fxOpen('Ubah harga & teks sekaligus','Berlaku untuk semua halaman di proyek ini. Bisa di-undo (Ctrl+Z).',true);
  body.innerHTML=`<div class="seg fxtabs" style="margin-bottom:14px"><button data-mt="price">Ubah harga massal</button><button data-mt="find">Cari & ganti teks</button></div><div id="mbody"></div>`;
  const show=t=>{body.querySelectorAll('[data-mt]').forEach(b=>b.classList.toggle('on',b.dataset.mt===t));t==='price'?massPriceUI():findUI();};
  body.querySelector('.fxtabs').onclick=ev=>{const b=ev.target.closest('[data-mt]');if(b)show(b.dataset.mt);};show(tabName||'price');}
function massNew(v){const s=massSt;let d=s.mode==='pct'?v*s.v/100:s.v;let n=s.dir==='up'?v+d:v-d;if(s.round>0)n=Math.round(n/s.round)*s.round;return Math.max(0,n);}
function massPriceUI(){const box=$('#mbody');const refs=allPriceRefs();const s=massSt;
  const rows=refs.map(r=>{const on=!s.off.has(r.key);const ctx=r.e.text.length>60?'…'+r.e.text.slice(Math.max(0,r.t.start-24),r.t.end+16).replace(/\n/g,' ')+'…':r.e.text.replace(/\n/g,' ');
    return `<tr class="${on?'':'off'}"><td><input type="checkbox" data-pk="${r.key}" ${on?'checked':''}></td><td class="mut">Hal. ${r.pi+1}</td><td>${esc(ctx)}</td><td class="num">${esc(r.t.raw)}</td><td class="num new">${on?esc(fmtLike(r.t,massNew(r.t.v))):'—'}</td></tr>`;}).join('');
  box.innerHTML=refs.length?`<div class="mctl">
   <div class="seg"><button data-ms="dir:up" class="${s.dir==='up'?'on':''}">Naikkan</button><button data-ms="dir:down" class="${s.dir==='down'?'on':''}">Turunkan</button></div>
   <input type="number" id="mv" value="${s.v}" min="0" step="${s.mode==='pct'?1:50000}" style="width:120px">
   <div class="seg"><button data-ms="mode:pct" class="${s.mode==='pct'?'on':''}">%</button><button data-ms="mode:rp" class="${s.mode==='rp'?'on':''}">Rupiah</button></div>
   <label class="mut">Bulatkan</label><select id="mr">${[[0,'Tidak'],[1000,'1 ribu'],[10000,'10 ribu'],[50000,'50 ribu'],[100000,'100 ribu'],[500000,'500 ribu'],[1000000,'1 juta']].map(([v,l])=>`<option value="${v}" ${s.round===v?'selected':''}>${l}</option>`).join('')}</select></div>
   <div class="hint" style="margin:10px 0">Ditemukan <b>${refs.length} harga</b> di ${new Set(refs.map(r=>r.pi)).size} halaman. Format penulisan tetap sama (IDR 6 Mil tetap "Mil", Rp 5.000.000 tetap titik). Hapus centang untuk harga yang tidak ingin diubah.</div>
   <div class="ptable"><table><thead><tr><th><input type="checkbox" id="pall" ${s.off.size?'':'checked'}></th><th></th><th>Teks</th><th class="num">Sekarang</th><th class="num">Jadi</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="fxfoot"><button class="btn pri" id="mapply">Terapkan ke ${refs.length-[...s.off].filter(k=>refs.some(r=>r.key===k)).length} harga</button></div>`
   :`<div class="empty">Belum ada harga yang terdeteksi. Harga dikenali dari tulisan seperti <b>Rp 5.000.000</b>, <b>IDR 6 Mil</b>, <b>7,5 Jt</b>, atau <b>350K</b>.</div>`;
  if(!refs.length)return;
  box.querySelector('.mctl').onclick=ev=>{const b=ev.target.closest('[data-ms]');if(!b)return;const[k,v]=b.dataset.ms.split(':');s[k]=v;if(k==='mode')s.v=v==='pct'?10:500000;massPriceUI();};
  $('#mv').oninput=ev=>{s.v=Math.max(0,+ev.target.value||0);updNew();};$('#mr').onchange=ev=>{s.round=+ev.target.value;massPriceUI();};
  const updNew=()=>{box.querySelectorAll('tbody tr').forEach((tr,i)=>{const r=refs[i];tr.querySelector('.new').textContent=s.off.has(r.key)?'—':fmtLike(r.t,massNew(r.t.v));});};
  box.querySelector('tbody').onchange=ev=>{const c=ev.target.closest('[data-pk]');if(!c)return;c.checked?s.off.delete(c.dataset.pk):s.off.add(c.dataset.pk);massPriceUI();};
  $('#pall').onchange=ev=>{if(ev.target.checked)s.off.clear();else refs.forEach(r=>s.off.add(r.key));massPriceUI();};
  $('#mapply').onclick=()=>{const byEl=new Map();refs.forEach(r=>{if(s.off.has(r.key))return;(byEl.get(r.e)||byEl.set(r.e,[]).get(r.e)).push(r.t);});let n=0;
    byEl.forEach((ts,e)=>{ts.sort((a,b)=>b.start-a.start).forEach(t=>{e.text=e.text.slice(0,t.start)+fmtLike(t,massNew(t.v))+e.text.slice(t.end);n++;});refitText(e);});
    s.off.clear();commit();renderAll();scheduleThumbs();toast(`${n} harga diperbarui`);massPriceUI();};}
let findSt={q:'',r:'',cs:false};
function findMatches(){const out=[];const q=findSt.q;if(!q)return out;const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),findSt.cs?'g':'gi');
  P.pages.forEach((pg,pi)=>pg.elements.forEach(e=>{if(e.type!=='text'||e.deco)return;const n=(e.text.match(re)||[]).length;if(n)out.push({pi,e,n});}));return{re,out};}
function findUI(){const box=$('#mbody');const yr=new Date().getFullYear();
  box.innerHTML=`<div class="fgrid"><div class="fld"><label>Cari teks</label><input type="text" id="fq" value="${esc(findSt.q)}" placeholder="contoh: 2027"></div>
   <div class="fld"><label>Ganti dengan</label><input type="text" id="fr" value="${esc(findSt.r)}" placeholder="contoh: 2028"></div></div>
   <label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0 10px"><input type="checkbox" id="fcs" ${findSt.cs?'checked':''}> Bedakan huruf besar/kecil</label>
   <div class="qk">Cepat: <button class="btn sm" data-fqk="2027|2028">2027 → 2028</button><button class="btn sm" data-fqk="${yr}|${yr+1}">${yr} → ${yr+1}</button><button class="btn sm" data-fqk="Mil|Jt">Mil → Jt</button><button class="btn sm" data-fqk="IDR |Rp ">IDR → Rp</button></div>
   <div id="fres" class="hint" style="margin:12px 0"></div><div class="fxfoot"><button class="btn pri" id="fapply" disabled>Ganti semua</button></div>`;
  const upd=()=>{const r=findMatches();const res=$('#fres');if(!findSt.q){res.textContent='Ketik teks yang ingin dicari.';$('#fapply').disabled=true;return;}
    const tot=r.out.reduce((a,b)=>a+b.n,0);res.innerHTML=tot?`Ditemukan <b>${tot}</b> kali di <b>${new Set(r.out.map(x=>x.pi)).size}</b> halaman.`:'Tidak ditemukan.';$('#fapply').disabled=!tot;$('#fapply').textContent=tot?`Ganti ${tot} teks`:'Ganti semua';};
  $('#fq').oninput=e=>{findSt.q=e.target.value;upd();};$('#fr').oninput=e=>{findSt.r=e.target.value;};$('#fcs').onchange=e=>{findSt.cs=e.target.checked;upd();};
  box.querySelector('.qk').onclick=ev=>{const b=ev.target.closest('[data-fqk]');if(!b)return;const[a,c]=b.dataset.fqk.split('|');findSt.q=a;findSt.r=c;findUI();};
  $('#fapply').onclick=()=>{const r=findMatches();let n=0;r.out.forEach(({e})=>{e.text=e.text.replace(r.re,()=>{n++;return findSt.r;});refitText(e);});commit();renderAll();scheduleThumbs();toast(`${n} teks diganti`);upd();};
  upd();setTimeout(()=>$('#fq')&&$('#fq').focus(),30);}

/* ---------- kalkulator paket & invoice ---------- */
const ADDON_LAYOUTS=['addon','ed_table','ed_list'];
const isPurePrice=(txt,t)=>(txt.slice(0,t.start)+txt.slice(t.end)).replace(/(mulai|dari|start|from|only|hanya|harga|price|[:*\-–|])/gi,'').trim().length<=2;
const cleanName=s=>String(s||'').replace(/\s+\+\s*$/,'').replace(/\s*[|·—–:]\s*$/,'').replace(/^\s*[|·—–:+•\-]\s*/,'').replace(/\s{2,}/g,' ').replace(/\s*\|\s*/g,' · ').replace(/\s*·\s*$/,'').trim();
function nameFor(pg,e,t){const r=e.role||'';const byRole=x=>pg.elements.find(z=>z.role===x);
  let m=/^tr(\d+)c(\d+)$/.exec(r);if(m){const lab=byRole(`tr${m[1]}c0`),hd=byRole(`th${+m[2]-1}`);const h=hd?hd.text:'';return cleanName((lab?lab.text:'')+(h&&!/^harga$/i.test(h)?' · '+h:''));}
  m=/^r(\d+)c(\d+)$/.exec(r);if(m){const lab=byRole(`r${m[1]}c0`)||byRole(`r${m[1]}c1`);if(lab&&lab!==e)return cleanName(lab.text);}
  let base='';if(pg.tpl&&pg.tpl.layout==='ed_pricebar'){const a=byRole('ta'),b=byRole('tb');if(a)base=cleanName(a.text+' '+(b?b.text:''));}
  m=/^r(\d+)p$/.exec(r);if(m&&byRole(`r${m[1]}n`))return cleanName([base,byRole(`r${m[1]}n`).text].filter(Boolean).join(' · '));
  m=/^sp(\d+)p$/.exec(r);if(m&&byRole(`sp${m[1]}l`))return cleanName([base,byRole(`sp${m[1]}l`).text].filter(Boolean).join(' · '));
  const isTxt=z=>z!==e&&z.type==='text'&&!z.deco&&z.text&&!/^\s*\*/.test(z.text)&&!/^(price|harga|total|investasi|investment)$/i.test(z.text.trim())&&!findPrices(z.text).length&&/[a-z]/i.test(z.text)&&z.text.length<=40;
  const ecy=e.y+e.h/2,ecx=e.x+e.w/2;
  const rowLab=pg.elements.filter(z=>isTxt(z)&&Math.abs(z.y+z.h/2-ecy)<Math.max(e.h,z.h)*0.6&&z.x+z.w<=e.x+4).sort((a,b)=>(e.x-a.x-a.w)-(e.x-b.x-b.w))[0];
  const colHead=rowLab?pg.elements.filter(z=>isTxt(z)&&z.y+z.h<=e.y&&e.y-(z.y+z.h)<220&&Math.abs(z.x+z.w/2-ecx)<Math.max(e.w,z.w)*0.45&&z.text.length<=24).sort((a,b)=>b.y-a.y)[0]:null;
  if(rowLab)return cleanName([base,rowLab.text,colHead&&colHead!==rowLab?colHead.text:''].filter(Boolean).join(' · '));
  if(base)return base;
  const cands=pg.elements.filter(z=>z!==e&&z.type==='text'&&!z.deco&&z.text&&z.text.length<=70&&!/^\s*\*/.test(z.text)&&!/\n/.test(z.text.trim())&&!findPrices(z.text).length&&/[a-z]/i.test(z.text));
  let best=null,bs=1e9;for(const z of cands){const dx=(z.x+z.w/2)-(e.x+e.w/2),dy=(z.y+z.h/2)-(e.y+e.h/2);let sc=Math.hypot(dx*0.6,dy);
    if(e.group&&z.group===e.group)sc-=400;if(z.y>e.y+e.h)sc+=250;if(z.size<e.size*0.6)sc+=120;if(/^(rating|note|sub|label|idx|cap|foot)$/.test(z.role||''))sc+=200;
    if(sc<bs){bs=sc;best=z;}}
  return best?cleanName(best.text):'Paket';}
function extractItems(){const items=[],seen=new Set();
  P.pages.forEach((pg,pi)=>{if(pg.hidden)return;const lay=pg.tpl&&pg.tpl.layout;if(lay==='ed_contract'||lay==='ed_promo')return;
    pg.elements.forEach(e=>{if(e.type!=='text'||e.deco||e.strike)return;const ts=findPrices(e.text);if(!ts.length)return;
      if(ts.length===1&&isPurePrice(e.text,ts[0])){const name=nameFor(pg,e,ts[0]);push(name,ts[0].v,lay,pi);return;}
      e.text.split('\n').forEach(line=>{const lt=findPrices(line);if(!lt.length)return;
        if(lt.length===1){let nm=line.slice(0,lt[0].start)+line.slice(lt[0].end);nm=cleanName(nm.replace(/\b(mulai|start from|only|hanya)\b/gi,''));if(nm.length<2)nm=nameFor(pg,e,lt[0]);push(nm,lt[0].v,lay,pi);return;}
        let prev=0;lt.forEach(t=>{let nm=cleanName(line.slice(prev,t.start).replace(/^[\s·|,;—–]+/,'').replace(/\b(mulai|start from|only|hanya)\b/gi,''));prev=t.end;if(nm.length<2)nm=nameFor(pg,e,t);push(nm,t.v,lay,pi);});});});});
  function push(name,v,lay,pi){const k=name.toLowerCase()+'|'+v;if(seen.has(k))return;seen.add(k);
    const addon=ADDON_LAYOUTS.includes(lay)||/\b(add|tambah|tambahan|extra|additional|overtime|drone|cetak|print|album|frame|canvas)\b/i.test(name);
    items.push({id:uid(),name:name||'Paket',price:Math.round(v),qty:1,on:false,kind:addon?'addon':'paket',pg:pi+1});}
  return items;}
function calcState(){if(!P.calc){const st=loadStudioPref&&loadStudioPref()||{};let bank='';try{bank=localStorage.getItem('pls_bank')||'';}catch(_){}
    const d=new Date();P.calc={items:extractItems(),doc:'invoice',no:`INV-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}-001`,date:d.toISOString().slice(0,10),
      client:{name:'',wa:'',event:'',venue:''},disc:{mode:'pct',v:0},dp:30,bank,note:'Terima kasih sudah mempercayakan momen spesialmu kepada kami.',terms:'DP tidak dapat dikembalikan. Pelunasan paling lambat H-7 acara.'};}
  return P.calc;}
function calcTotals(){const c=calcState();const sub=c.items.filter(i=>i.on).reduce((a,i)=>a+i.price*(i.qty||1),0);
  const disc=Math.min(sub,c.disc.mode==='pct'?Math.round(sub*(+c.disc.v||0)/100):(+c.disc.v||0));const total=sub-disc;const dp=Math.round(total*(+c.dp||0)/100);return{sub,disc,total,dp,rest:total-dp};}
function openCalc(){calcState();const body=fxOpen('Kalkulator paket & invoice','Pilih paket & add-on dari price list-mu, isi data klien, lalu buat invoice atau penawaran harga dalam PDF.',true);
  body.innerHTML=`<div class="cgrid"><div><div class="chead"><b>Paket & add-on</b><div style="display:flex;gap:6px"><button class="btn sm" data-c="reextract" title="Baca ulang harga dari semua halaman">↻ Ambil dari price list</button><button class="btn sm" data-c="additem">+ Item manual</button></div></div><div id="citems"></div></div><div id="cside"></div></div>`;
  calcItemsUI();calcSideUI();
  body.addEventListener('click',calcClick);body.addEventListener('input',calcInput);body.addEventListener('change',calcInput);}
function calcItemsUI(){const c=calcState();const box=$('#citems');if(!box)return;
  const sec=(kind,lab)=>{const list=c.items.filter(i=>i.kind===kind);return `<div class="clab2">${lab}</div>`+(list.length?list.map(i=>`<div class="citem ${i.on?'on':''}" data-id="${i.id}">
    <input type="checkbox" data-cf="on" ${i.on?'checked':''}><input type="text" data-cf="name" value="${esc(i.name)}"><input type="text" class="cprice" data-cf="price" value="${groupTh(i.price,'.')}" inputmode="numeric">
    <input type="number" data-cf="qty" value="${i.qty||1}" min="1" class="cqty" title="Jumlah"><button class="btn ico sm" data-c="kind" title="Pindah ke ${kind==='paket'?'add-on':'paket'}">⇅</button><button class="btn ico sm" data-c="del" title="Hapus">✕</button></div>`).join(''):'<div class="hint" style="padding:6px 2px">Belum ada.</div>');};
  box.innerHTML=(c.items.length?'':`<div class="empty">Belum ada harga terdeteksi di price list. Klik <b>+ Item manual</b> untuk menambah paket.</div>`)+sec('paket','Paket')+sec('addon','Add-on & tambahan');}
function calcSideUI(){const c=calcState();const box=$('#cside');if(!box)return;const t=calcTotals();
  box.innerHTML=`<div class="seg" style="margin-bottom:10px"><button data-c="doc:invoice" class="${c.doc==='invoice'?'on':''}">Invoice</button><button data-c="doc:quote" class="${c.doc==='quote'?'on':''}">Penawaran harga</button></div>
   <div class="fgrid"><div class="fld"><label>No. dokumen</label><input data-cs="no" value="${esc(c.no)}"></div><div class="fld"><label>Tanggal</label><input type="date" data-cs="date" value="${esc(c.date)}"></div></div>
   <div class="clab2">Klien</div><div class="fgrid"><div class="fld"><label>Nama klien</label><input data-cs="client.name" value="${esc(c.client.name)}" placeholder="Rani & Dimas"></div><div class="fld"><label>WhatsApp klien</label><input data-cs="client.wa" value="${esc(c.client.wa)}" placeholder="0812…"></div>
   <div class="fld"><label>Tanggal acara</label><input data-cs="client.event" value="${esc(c.client.event)}" placeholder="12 Juni 2027"></div><div class="fld"><label>Lokasi</label><input data-cs="client.venue" value="${esc(c.client.venue)}" placeholder="Bandung"></div></div>
   <div class="clab2">Diskon & DP</div><div class="fgrid"><div class="fld"><label>Diskon</label><div style="display:flex;gap:6px"><input type="number" data-cs="disc.v" value="${c.disc.v}" min="0" style="flex:1"><div class="seg"><button data-c="dm:pct" class="${c.disc.mode==='pct'?'on':''}">%</button><button data-c="dm:rp" class="${c.disc.mode==='rp'?'on':''}">Rp</button></div></div></div>
   <div class="fld"><label>DP (%)</label><input type="number" data-cs="dp" value="${c.dp}" min="0" max="100"></div></div>
   <div class="fld"><label>Rekening / cara bayar</label><textarea data-cs="bank" rows="2" placeholder="BCA 123 456 7890 a.n. Nama Studio">${esc(c.bank)}</textarea></div>
   <div class="fld"><label>Catatan untuk klien</label><textarea data-cs="note" rows="2">${esc(c.note)}</textarea></div>
   <div class="fld"><label>Ketentuan singkat</label><textarea data-cs="terms" rows="2">${esc(c.terms)}</textarea></div>
   <div class="ctot" id="ctot">${totHtml(t)}</div>
   <div class="stack" style="margin-top:10px"><button class="btn pri full" data-c="pdf">${ic('dl')} Download ${c.doc==='invoice'?'invoice':'penawaran'} (PDF)</button>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="btn full" data-c="png">${ic('img')} Simpan sebagai gambar</button><button class="btn full" data-c="copy">${ic('copy')} Salin teks WA</button></div>
   <a class="btn full" id="cwa" target="_blank" rel="noopener" style="text-decoration:none;justify-content:center">Kirim rincian ke WhatsApp klien</a></div>
   <canvas id="cprev" style="width:100%;margin-top:12px;border:1px solid var(--line);border-radius:8px"></canvas>`;
  updWaLink();schedulePrev();}
function totHtml(t){const c=calcState();return `<div><span>Subtotal</span><b>${rupiah(t.sub)}</b></div>${t.disc?`<div><span>Diskon${c.disc.mode==='pct'?` ${c.disc.v}%`:''}</span><b>− ${rupiah(t.disc)}</b></div>`:''}
  <div class="big"><span>Total</span><b>${rupiah(t.total)}</b></div>${c.dp>0?`<div><span>DP ${c.dp}%</span><b>${rupiah(t.dp)}</b></div><div><span>Sisa pelunasan</span><b>${rupiah(t.rest)}</b></div>`:''}`;}
function waText(){const c=calcState(),t=calcTotals(),st=curStudio();const on=c.items.filter(i=>i.on);const title=c.doc==='invoice'?'INVOICE':'PENAWARAN HARGA';
  let s=`*${title} ${c.no}*\n${st.name}\n\n`;if(c.client.name)s+=`Klien: ${c.client.name}\n`;if(c.client.event)s+=`Tanggal acara: ${c.client.event}\n`;if(c.client.venue)s+=`Lokasi: ${c.client.venue}\n`;
  s+='\n'+(on.length?on.map(i=>`• ${i.name}${(i.qty||1)>1?` ×${i.qty}`:''} — ${rupiah(i.price*(i.qty||1))}`).join('\n'):'(belum ada paket dipilih)')+'\n\n';
  s+=`Subtotal: ${rupiah(t.sub)}\n`;if(t.disc)s+=`Diskon: − ${rupiah(t.disc)}\n`;s+=`*Total: ${rupiah(t.total)}*\n`;if(c.dp>0)s+=`DP ${c.dp}%: ${rupiah(t.dp)}\nSisa pelunasan: ${rupiah(t.rest)}\n`;
  if(c.bank)s+=`\nPembayaran:\n${c.bank}\n`;if(c.terms)s+=`\n${c.terms}\n`;if(c.note)s+=`\n${c.note}`;return s.trim();}
function updWaLink(){const a=$('#cwa');if(!a)return;const c=calcState();let n=String(c.client.wa||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);
  a.href=`https://wa.me/${n}?text=${encodeURIComponent(waText())}`;a.style.opacity=n?1:.55;a.title=n?'':'Isi WhatsApp klien dulu (atau pilih kontak di WhatsApp)';}
let prevT=null;function schedulePrev(){clearTimeout(prevT);prevT=setTimeout(async()=>{const cv=$('#cprev');if(!cv)return;const pages=await drawInvoice(1);const p=pages[0];cv.width=p.width;cv.height=p.height;cv.getContext('2d').drawImage(p,0,0);},250);}
function calcRefresh(items){const t=calcTotals();const tb=$('#ctot');if(tb)tb.innerHTML=totHtml(t);if(items)calcItemsUI();updWaLink();schedulePrev();dirty();}
async function calcClick(ev){const b=ev.target.closest('[data-c]');if(!b)return;const c=calcState();const a=b.dataset.c;const row=b.closest('.citem');const it=row&&c.items.find(i=>i.id===row.dataset.id);
  if(a.startsWith('doc:')){c.doc=a.slice(4);const d=new Date(c.date||Date.now());c.no=c.no.replace(/^(INV|QUO)/,c.doc==='invoice'?'INV':'QUO');calcSideUI();dirty();return;}
  if(a.startsWith('dm:')){c.disc.mode=a.slice(3);calcSideUI();dirty();return;}
  switch(a){
    case'reextract':{const fresh=extractItems();let n=0;fresh.forEach(f=>{if(!c.items.some(i=>i.name.toLowerCase()===f.name.toLowerCase()&&i.price===f.price)){c.items.push(f);n++;}});calcItemsUI();toast(n?`${n} harga baru ditambahkan`:'Tidak ada harga baru di price list');dirty();break;}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;};
function makeZip(files){const enc=new TextEncoder();const parts=[],cen=[];let off=0;const d=new Date();
  const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const f of files){const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,f.data);const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+sz;}
  const cs=cen.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'});}

/* ---------- aturan proyek tersimpan ----------
   1. Proyek baru = draf. Baru masuk daftar "Proyek tersimpan" setelah ada perubahan pertama.
   2. Ganti template saat proyek masih draf → menggantikan draf itu (tidak menumpuk).
   3. Ganti template saat proyek sudah diedit → pilih: proyek baru, atau ganti di proyek ini.
   4. Daftar proyek bisa diganti nama, diduplikat, dihapus satu-satu atau sekaligus. */
const isDraft=()=>P&&P.touched===false;
async function openNewProject(p,mode){
  if(isDraft()&&mode!=='new'){p.touched=false;loadProject(p);updDocStatus();return 'replace';}
  const ch=mode||await modal('Pakai template ini untuk…',`Proyek "${P.name}" sudah kamu edit dan tetap aman tersimpan.`,[['Batal',null],['Ganti di proyek ini','replace'],['Buat proyek baru','new','pri']]);
  if(!ch)return null;if(ch==='new'&&!await confirmLeave())return null;await saveNow(true);
  if(ch==='replace'){p.id=P.id;p.name=P.name;p.file=P.file;p.savedAt=P.savedAt;p.calc=P.calc;p.safe=P.safe;p.touched=true;loadProject(p);await saveNow(true);toast('Template diganti · isian yang sudah kamu ketik ikut dibawa');}
  else{p.touched=false;loadProject(p);updDocStatus();}
  return ch;}
async function duplicateProject(){if(editingId)finishEdit();P.touched=true;await saveNow(true);const c=Object.assign(clone(packProject()),{id:'p'+uid(),name:P.name+' (salinan)',touched:true,file:null,savedAt:null});c.assets=Object.assign({},P.assets);
  loadProject(c);await saveNow(true);toast('Proyek diduplikat · kamu sekarang di salinannya');if(tab==='proj')renderLeft();}

/* =========================================================
   MODEL DOKUMEN seperti aplikasi desktop:
   - proyek disimpan ke FILE .moodify (Simpan / Simpan sebagai)
   - status "belum disimpan" + konfirmasi sebelum menutup / pindah proyek
   - Beranda dengan riwayat proyek yang pernah dibuka / disimpan
   - salinan pemulihan otomatis tetap dibuat agar pekerjaan tidak hilang
   ========================================================= */
const FS_OK=(()=>{try{return !window.pricelistNative&&typeof window.showSaveFilePicker==='function'&&window.self===window.top;}catch(e){return false;}})();
const fileHandles=new Map();var savedState=null;
function isUnsaved(){return !!P&&P.touched!==false&&stateStr()!==savedState;}
function updDocStatus(){if(!P)return;const st=$('#status');let t,cls='';
  if(P.touched===false){t='Draf baru';}
  else if(isUnsaved()){t=P.file?`● Ada perubahan · ${P.file}`:'● Belum disimpan ke file';cls='unsaved';}
  else{t=`Tersimpan · ${P.file}`;cls='saved';}
  st.textContent=t;st.className=cls;st.title=P.file?'File: '+P.file:'Simpan dengan Ctrl/⌘+S';document.title=(cls==='unsaved'?'• ':'')+P.name+' — Price List Studio';}
async function saveFile(asNew){if(!P)return false;if(editingId)finishEdit();P.touched=true;
  let name=P.file&&!asNew?P.file:null;let ok=false;
  const h=!asNew&&fileHandles.get(P.id);
  if(h){try{const blob=await packFileBlob();const w=await h.createWritable();await w.write(blob);await w.close();ok=h.name;}catch(e){console.warn(e);}}
  if(!ok&&FS_OK){try{const hh=await window.showSaveFilePicker({suggestedName:(P.file||slug(P.name)+'.moodify'),types:[{description:'Proyek Price List Studio',accept:{'application/octet-stream':['.moodify']}}]});
      P.file=hh.name;const blob=await packFileBlob();const w=await hh.createWritable();await w.write(blob);await w.close();fileHandles.set(P.id,hh);ok=hh.name;}
    catch(e){if(e&&e.name==='AbortError')return false;console.warn(e);}}
  if(!ok){if(!name){const nm=await modalInput(asNew?'Simpan sebagai':'Simpan proyek','Nama file proyek:',(P.file||slug(P.name)).replace(/\.moodify(\.json)?$/,''));if(!nm)return false;name=slug(nm)+'.moodify';}
    const prev=P.file;P.file=name;const blob=await packFileBlob();const r=await download(blob,name,name+'.json');if(!r){P.file=prev;return false;}ok=r;
    if(!localStorage.getItem('pls_dlnote')){try{localStorage.setItem('pls_dlnote','1');}catch(_){}setTimeout(()=>toast('Versi web menyimpan file ke folder Download. Di aplikasi desktop, Simpan langsung menimpa file yang sama.',5200),2600);}}
  P.file=ok;P.savedAt=Date.now();savedState=stateStr();await saveNow(true);updDocStatus();toast(`Tersimpan ke file ${ok}`);return true;}
/* tanya simpan sebelum meninggalkan proyek yang berubah */
async function confirmLeave(){if(!isUnsaved())return true;
  const ch=await modal(`Simpan perubahan di "${P.name}"?`,'Perubahanmu belum disimpan ke file. Kalau tidak disimpan, salinannya tetap ada di Riwayat proyek sebagai "belum disimpan".',[['Batal',null],['Jangan simpan','no'],['Simpan','yes','pri']]);
  if(!ch)return false;if(ch==='yes')return await saveFile(false);return true;}
window.addEventListener('beforeunload',e=>{if(isUnsaved()){e.preventDefault();e.returnValue='';}});
/* buka file .moodify (pakai jendela buka file sistem bila tersedia) */
async function openProjectFile(){if(!await confirmLeave())return;
  const load=async(f,handle)=>{try{const p=await unpackFile(f);if(!Array.isArray(p.pages)||!p.pages.length)throw new Error('bad');
      p.id=p.id||'p'+uid();p.size=SIZES[p.size]?p.size:'a4';p.orientation=p.orientation==='landscape'?'landscape':'portrait';p.assets=p.assets||{};p.name=p.name||f.name.replace(/\..*$/,'');
      p.file=f.name.replace(/\.json$/,'');p.touched=true;if(handle)fileHandles.set(p.id,handle);
      loadProject(p);savedState=stateStr();await saveNow(true);updDocStatus();closeHome();
      if(p.studio&&!loadStudioPref()){const pr=Object.assign({},p.studio,{savedAt:Date.now()});if(p.studioLogo&&p.assets[p.studioLogo])pr.logo=p.assets[p.studioLogo];saveStudioPref(pr);toast('Proyek dibuka · data studio dari file ini juga disimpan');}
      else toast(`Dibuka: ${p.file}`);if(tab==='proj')renderLeft();}
    catch(e){console.warn(e);toast('File tidak dikenali. Pilih file .moodify yang disimpan dari Price List Studio.',3800);}};
  if(FS_OK&&typeof window.showOpenFilePicker==='function'){try{const[h]=await window.showOpenFilePicker({types:[{description:'Proyek Price List Studio',accept:{'application/octet-stream':['.moodify'],'application/json':['.json']}}]});await load(await h.getFile(),h);return;}catch(e){if(e&&e.name==='AbortError')return;}}
  const inp=$('#fileProj');inp.value='';inp.onchange=()=>{const f=inp.files[0];if(f)load(f);};inp.click();}
async function openFromHistory(id){if(P&&id===P.id){closeHome();return;}if(!await confirmLeave())return;await saveNow(true);
  const r=await DB.get(id).catch(()=>null);if(!r||!r.data){toast('Proyek tidak ditemukan');return;}
  const p=r.data;p.file=r.file||p.file||null;p.touched=true;loadProject(p);savedState=(r.file&&!r.unsaved)?stateStr():null;updDocStatus();closeHome();
  toast(r.file?`Dibuka dari riwayat · ${r.file}`:'Dibuka dari riwayat · jangan lupa simpan ke file (Ctrl/⌘+S)',3800);if(tab==='proj')renderLeft();}

let homeQ='';
function when2(t){if(!t)return'';const d=(Date.now()-t)/1000;if(d<60)return'baru saja';if(d<3600)return Math.floor(d/60)+' menit lalu';if(d<86400)return Math.floor(d/3600)+' jam lalu';if(d<86400*7)return Math.floor(d/86400)+' hari lalu';
  return new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});}
async function historyList(){let list=[];try{list=await DB.all();}catch(e){}return list.sort((a,b)=>(b.opened||b.updated)-(a.opened||a.updated));}
async function openHome(){let h=$('#home');if(!h){h=document.createElement('div');h.id='home';document.body.appendChild(h);

     <button class="hbtn" data-hblank>${ic('file')}<span><b>Halaman kosong</b><small>Mulai dari nol</small></span></button>
     <button class="hbtn" data-hopenf>${ic('up')}<span><b>Buka file…</b><small>File .moodify di komputermu</small></span></button>
     <div class="hint" style="margin-top:14px;line-height:1.55">Simpan proyek dengan <b>Ctrl/⌘+S</b>. File <b>.moodify</b> bisa dibuka lagi kapan saja, dipindah ke komputer lain, atau dikirim ke tim.</div></div>
    <div class="hmain"><div class="hmtop"><div class="hlab" style="margin:0">Riwayat proyek</div><input type="text" id="hq" placeholder="Cari proyek…" value="${esc(homeQ)}"></div><div id="hlist" class="hlist"><div class="hint">Memuat…</div></div></div></div></div>`;

async function fillHome(keepFocus){const box=$('#hlist');if(!box)return;let list=await historyList();if(homeQ)list=list.filter(r=>(r.name||'').toLowerCase().includes(homeQ)||(r.file||'').toLowerCase().includes(homeQ));
  box.innerHTML=list.length?list.map(r=>{const cur=P&&r.id===P.id;const badge=!r.file?'<em class="bw">Belum pernah disimpan ke file</em>':r.unsaved?'<em class="bw">Ada perubahan belum disimpan</em>':'';

   ========================================================= */
const NATIVE=window.pricelistNative||null;
if(NATIVE){
  document.documentElement.classList.add('native');
  const toBytes=async blob=>new Uint8Array(await blob.arrayBuffer());
  /* simpan proyek ke file (.moodify) */
  saveFile=async function(asNew){if(!P)return false;if(editingId)finishEdit();P.touched=true;
    const suggested=(P.file||slug(P.name)+'.moodify');
    const prev=[P.file,P.path];
    try{const res=await NATIVE.saveProject(asNew?null:(P.path||null),suggested,null);if(!res||res.canceled)return false;
      P.file=res.name;P.path=res.path;const bytes=await toBytes(await packFileBlob());await NATIVE.writeFile(res.path,bytes);}
    catch(e){console.error(e);[P.file,P.path]=prev;toast('Gagal menyimpan file: '+(e.message||e),4500);return false;}
    P.savedAt=Date.now();savedState=stateStr();await saveNow(true);updDocStatus();toast(`Tersimpan · ${P.file}`);return true;};
  /* buka proyek dari path */
  async function openPath(path,bytes){try{if(!bytes)bytes=await NATIVE.readFile(path);const name=path.split(/[\\/]/).pop();
      const p=await unpackFile(new File([bytes],name));if(!Array.isArray(p.pages)||!p.pages.length)throw new Error('bad');
      p.id=p.id||'p'+uid();p.size=SIZES[p.size]?p.size:'a4';p.orientation=p.orientation==='landscape'?'landscape':'portrait';p.assets=p.assets||{};p.name=p.name||name.replace(/\..*$/,'');
      /* proyek yang sama sudah ada di riwayat → pakai id-nya */
      try{const all=await DB.all();const same=all.find(r=>r.path===path);if(same)p.id=same.id;else if(all.some(r=>r.id===p.id&&r.path&&r.path!==path))p.id='p'+uid();}catch(_){}
      p.file=name;p.path=path;p.touched=true;loadProject(p);savedState=stateStr();await saveNow(true);updDocStatus();closeHome();closeGallery();toast(`Dibuka: ${name}`);if(tab==='proj')renderLeft();return true;}
    catch(e){console.warn(e);toast('File tidak bisa dibuka. Pastikan file .moodify dari Price List Studio dan masih ada di lokasinya.',4500);return false;}}
  openProjectFile=async function(){if(!await confirmLeave())return;const r=await NATIVE.openProjectDialog();if(!r||r.canceled)return;await openPath(r.path,r.bytes);};
  const _ofh=openFromHistory;
  openFromHistory=async function(id){if(P&&id===P.id){closeHome();return;}const r=await DB.get(id).catch(()=>null);
    if(r&&r.path&&await NATIVE.exists(r.path)){if(!await confirmLeave())return;await saveNow(true);
      if(r.unsaved){const ch=await modal('Ada perubahan yang belum disimpan','Proyek ini punya perubahan terakhir yang belum disimpan ke file. Buka versi mana?',[['Versi di file',false],['Lanjutkan perubahan terakhir',true,'pri']]);
        if(ch){return _ofh(id);}}
      return openPath(r.path);}
    if(r&&r.path)toast('File aslinya tidak ditemukan (dipindah/dihapus). Dibuka dari salinan riwayat.',4500);
    return _ofh(id);};
  /* export (PDF, gambar, ZIP, invoice) lewat jendela simpan */
  download=async function(blob,name){try{const r=await NATIVE.saveExport(name,await toBytes(blob));return r&&!r.canceled?r.name:false;}catch(e){console.error(e);toast('Gagal menyimpan: '+(e.message||e),4000);return false;}};
  /* klik 2x file .moodify / buka lewat "Open with" */
  NATIVE.onOpenPath(async path=>{if(!await confirmLeave())return;openPath(path);});
  /* riwayat menyimpan path */
  const _put=DB.put;DB.put=r=>{if(P&&r&&r.id===P.id&&P.path)r.path=P.path;return _put(r);};
  window.addEventListener('load',()=>NATIVE.ready&&NATIVE.ready());setTimeout(()=>NATIVE.ready&&NATIVE.ready(),1500);
}

</script>
</body>
