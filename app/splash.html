<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Price List Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden;font-family:"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none}
:root{--gold:#c9a25c;--gold2:#e8cf9a;--ink:#0b0a08}
.card{position:relative;height:100%;border-radius:24px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#1d1812 0%,#0e0c09 55%,#080706 100%);border:1px solid #3a3226;-webkit-app-region:drag}
.card:after{content:"";position:absolute;inset:14px;border:1px solid rgba(201,162,92,.25);border-radius:15px;pointer-events:none}
/* cahaya bergerak */
.glow{position:absolute;width:420px;height:420px;border-radius:50%;left:50%;top:-120px;margin-left:-210px;background:radial-gradient(circle,rgba(201,162,92,.28),transparent 65%);animation:breathe 3.2s ease-in-out infinite}
.sweep{position:absolute;top:0;bottom:0;width:140px;left:-200px;background:linear-gradient(100deg,transparent,rgba(232,207,154,.10),transparent);transform:skewX(-14deg);animation:sweep 2.6s .4s ease-in-out infinite}
.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold2);opacity:0;animation:float 4s linear infinite}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 60px}
/* tumpukan halaman */
.stack{position:relative;width:200px;height:120px;margin-bottom:16px}
.pg{position:absolute;left:50%;top:0;width:78px;height:108px;margin-left:-39px;border-radius:7px;background:#17130e;border:1px solid rgba(201,162,92,.55);box-shadow:0 12px 26px rgba(0,0,0,.55);opacity:0;transform-origin:50% 120%;animation:fan 1s cubic-bezier(.2,.8,.2,1) forwards}
.pg b{position:absolute;left:10px;right:10px;height:3px;border-radius:2px;background:rgba(201,162,92,.55)}
.pg b:nth-child(1){top:14px;width:36px;background:var(--gold)}.pg b:nth-child(2){top:62px;opacity:.5}.pg b:nth-child(3){top:72px;width:42px;opacity:.5}.pg b:nth-child(4){top:82px;width:30px;opacity:.5}
.pg .ph{position:absolute;left:10px;right:10px;top:26px;height:28px;border-radius:3px;background:linear-gradient(135deg,rgba(201,162,92,.28),rgba(201,162,92,.06))}
.pg:nth-child(1){--r:-26deg;--x:-62px;animation-delay:.15s}
.pg:nth-child(2){--r:-9deg;--x:-21px;animation-delay:.3s}
.pg:nth-child(3){--r:9deg;--x:21px;animation-delay:.45s}
.pg:nth-child(4){--r:26deg;--x:62px;animation-delay:.6s}
.pg:nth-child(5){--r:0deg;--x:0px;animation-delay:.8s;border-color:var(--gold);background:#1c1711}
.pg:nth-child(5) .logo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-style:italic;font-size:46px;color:var(--gold2)}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:36px;letter-spacing:.6px;color:#f6efe2;animation:up .8s .5s both}
.by{font-size:12px;letter-spacing:5px;text-transform:uppercase;color:var(--gold);margin-top:10px;font-weight:600;animation:up .8s .7s both}
/* progres */
.prog{width:100%;max-width:400px;margin-top:30px;animation:up .8s .9s both}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.st{font-size:12.5px;color:#b9ae9b;letter-spacing:.3px}
.pct{font-family:Georgia,serif;font-size:22px;color:var(--gold2);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#9b7a3e,var(--gold) 55%,var(--gold2));box-shadow:0 0 16px rgba(232,207,154,.65);position:relative}
.bar i:after{content:"";position:absolute;right:0;top:-3px;width:10px;height:11px;border-radius:50%;background:#fff6dc;filter:blur(2.5px)}
.steps{display:flex;gap:14px;margin-top:13px;justify-content:space-between}
.steps span{font-size:11px;color:#6f6657;display:flex;align-items:center;gap:6px;transition:color .3s}
.steps span:before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid #5a5143;transition:.3s}
.steps span.on{color:#d9cdb6}.steps span.on:before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(201,162,92,.8)}
.ver{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:10.5px;color:#6f6657;letter-spacing:2px;z-index:2}
@keyframes fan{from{opacity:0;transform:translateX(0) rotate(0) translateY(18px) scale(.85)}to{opacity:1;transform:translateX(var(--x)) rotate(var(--r)) translateY(0) scale(1)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:1;transform:scale(1.08)}}
@keyframes sweep{0%{left:-200px}100%{left:760px}}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-120px);opacity:0}}
</style></head><body>
<div class="card">
 <div class="glow"></div><div class="sweep"></div><div class="dust" id="dust"></div>
 <div class="wrap">
  <div class="stack"><div class="pg"><div class="ph"></div><b></b><b></b><b></b><b></b></div><div class="pg"><div class="ph"></div><b></b><b></b><b></b><b></b></div><div class="pg"><div class="ph"></div><b></b><b></b><b></b><b></b></div><div class="pg"><div class="ph"></div><b></b><b></b><b></b><b></b></div><div class="pg"><div class="logo">P</div></div></div>
  <h1>Price List Studio</h1><div class="by">by Moodifypreset</div>
  <div class="prog"><div class="row"><div class="st" id="st">Memulai…</div><div class="pct" id="pct">0%</div></div>
   <div class="bar"><i id="fill"></i></div>
   <div class="steps" id="steps"><span>Template</span><span>Font</span><span>Editor</span><span>Ruang kerja</span></div></div>
 </div>
 <div class="ver">MEMUAT DATA APLIKASI</div>
</div>
<script>
const D=3000, msgs=[[0,'Memulai aplikasi…'],[12,'Memuat 44 template…'],[38,'Menyiapkan font & tipografi…'],[62,'Menyiapkan editor & kanvas…'],[86,'Membuka ruang kerja…'],[99,'Siap!']];
const marks=[12,38,62,86];
const st=document.getElementById('st'),pct=document.getElementById('pct'),fill=document.getElementById('fill'),steps=[...document.querySelectorAll('#steps span')];
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
// kemajuan bertahap seperti memuat data sungguhan (kadang cepat, kadang tertahan)
const keys=[[0,0],[.12,9],[.3,34],[.42,38],[.62,70],[.74,74],[.92,97],[1,100]];
function val(t){for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const a=keys[i-1],b=keys[i];return a[1]+(b[1]-a[1])*ease((t-a[0])/(b[0]-a[0]));}}return 100;}
const t0=performance.now();
(function tick(){const t=Math.min(1,(performance.now()-t0)/D),v=val(t);
 fill.style.width=v+'%';pct.textContent=Math.round(v)+'%';
 let m=msgs[0][1];msgs.forEach(([p,s])=>{if(v>=p)m=s;});st.textContent=m;
 steps.forEach((el,i)=>el.classList.toggle('on',v>=marks[i]+8));
 if(t<1)requestAnimationFrame(tick);})();
const dust=document.getElementById('dust');
for(let i=0;i<22;i++){const e=document.createElement('i');e.style.left=(8+Math.random()*84)+'%';e.style.top=(45+Math.random()*50)+'%';e.style.animationDelay=(Math.random()*4)+'s';e.style.animationDuration=(3+Math.random()*3)+'s';dust.appendChild(e);}
</script></body></html>
